<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">


    <title>Grille de Pixels Canvas avec Palette</title>
    <link rel="stylesheet" href="style.css">
 
</head>
<body>
    <div class="controls">
        <div class="tool-group">
            <button id="drawTool" class="active" onclick="setTool('draw')">✏️ Crayon</button>
            <button id="eraserTool" onclick="setTool('eraser')">🧹 Gomme</button>
            <button id="bucketTool" onclick="setTool('bucket')">🪣 Pot de peinture</button>
            <button id="eyedropperTool" onclick="setTool('eyedropper')">💧 Pipette</button>
            <button id="selectTool" onclick="setTool('select')">🔲 Sélection</button>
            <button id="panTool" onclick="setTool('pan')">✋ Déplacer</button>
        </div>
        <div class="tool-group">
            <button onclick="togglePalette()">🎨 Palette</button>
            <div class="color-indicators">
                <div class="color-button primary" id="primaryColor" onclick="selectPrimaryColor()"></div>
                <div class="color-button secondary" id="secondaryColor" onclick="selectSecondaryColor()"></div>
            </div>
        </div>
        <div class="control-group">
            <div class="pixel-size-control">
                <label>Taille:</label>
                <input type="range" id="pixelSizeSlider" min="5" max="50" value="20" oninput="changePixelSize(this.value)">
                <span id="pixelSizeValue">20px</span>
            </div>
        </div>
        <div class="control-group">
            <label>Dimensions:</label>
            <input type="number" id="gridWidthInput" value="32" min="1" style="width: 70px">
            <span>×</span>
            <input type="number" id="gridHeightInput" value="800" min="1" style="width: 70px">
            <button onclick="changeGridSize(document.getElementById('gridWidthInput').value, document.getElementById('gridHeightInput').value)">Appliquer</button>
        </div>
        <div class="tool-group">
            <button onclick="clearGrid()">🗑️ Effacer tout</button>
            <button onclick="deleteSelected()" class="delete" id="deleteBtn" style="display:none">❌ Supprimer zone</button>
        </div>
        <div class="tool-group">
            <button onclick="expandGrid()">➕ Agrandir</button>
        </div>
        <div class="info">
            <div id="modeInfo">Mode crayon : Clic gauche/droit pour dessiner</div>
            <div style="font-size: 10px; margin-top: 3px; color: #888;">D = Crayon, B = Pot, I = Pipette, S = Sélection</div>
        </div>
    </div>

    <div class="mode-indicator" id="modeIndicator">Mode: Crayon</div>
    <div class="selection-info" id="selectionInfo">Zone sélectionnée</div>

    <div class="palette-overlay" id="paletteOverlay">
        <div class="palette-window">
            <div class="palette-header">
                <div class="palette-title">Palette de Couleurs</div>
                <button class="close-btn" onclick="togglePalette()">&times;</button>
            </div>
            
            <div class="selection-buttons">
                <button class="selection-btn active" id="primaryBtn" onclick="setColorSelection('primary')">
                    Couleur Gauche (G)
                </button>
                <button class="selection-btn" id="secondaryBtn" onclick="setColorSelection('secondary')">
                    Couleur Droite (D)
                </button>
            </div>

            <div class="color-grid" id="colorGrid">
                <!-- Colors will be generated by JavaScript -->
            </div>

            <div class="color-editor" id="colorEditor">
                <div class="editor-header">
                    <div style="display: flex; align-items: center;">
                        <div class="color-preview" id="colorPreview"></div>
                        <div class="rgb-controls">
                            <div class="rgb-slider">
                                <label>R</label>
                                <input type="range" id="redSlider" min="0" max="255" value="0">
                                <input type="number" id="redInput" min="0" max="255" value="0">
                            </div>
                            <div class="rgb-slider">
                                <label>G</label>
                                <input type="range" id="greenSlider" min="0" max="255" value="0">
                                <input type="number" id="greenInput" min="0" max="255" value="0">
                            </div>
                            <div class="rgb-slider">
                                <label>B</label>
                                <input type="range" id="blueSlider" min="0" max="255" value="0">
                                <input type="number" id="blueInput" min="0" max="255" value="0">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="color-wheel-container">
                    <canvas class="color-wheel" id="colorWheel" width="200" height="200"></canvas>
                    <div class="color-wheel-pointer" id="colorWheelPointer"></div>
                </div>

                <div class="brightness-slider-container">
                    <div class="brightness-slider" id="brightnessSlider">
                        <div class="brightness-pointer" id="brightnessPointer"></div>
                    </div>
                </div>
                
                <div class="hex-input">
                    <label>Hex: </label>
                    <input type="text" id="hexInput" placeholder="#000000">
                </div>

                <div class="editor-actions">
                    <button class="save-btn" onclick="saveColor()">Sauvegarder</button>
                    <button class="cancel-btn" onclick="cancelColorEdit()">Annuler</button>
                    <button class="delete-color-btn" onclick="deleteColor()" id="deleteColorBtn" style="display:none">Supprimer</button>
                </div>
            </div>

            <div class="keyboard-shortcuts">
                <strong>Raccourcis:</strong> D = Crayon, B = Pot, I = Pipette, S = Sélection, P = Palette, X = Échanger couleurs
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="pixelCanvas"></canvas>
    </div>
    <script src="app.js"></script>
</body>
</html>
